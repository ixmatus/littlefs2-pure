# Cargo-fuzz crate. Lives outside the parent workspace because
# libfuzzer-sys plus nightly-only sanitizers do not mix with the
# library crate's stable / no_std posture. Build via
# `cargo +nightly fuzz run <target>` from this directory.
[workspace]

[package]
name = "littlefs2-pure-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.littlefs2-pure]
path = ".."

# Each target must be listed for cargo-fuzz to discover it.
[[bin]]
name = "meta_reader_parse"
path = "fuzz_targets/meta_reader_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tag_decode"
path = "fuzz_targets/tag_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_validate"
path = "fuzz_targets/path_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "superblock_parse"
path = "fuzz_targets/superblock_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ctz_struct_decode"
path = "fuzz_targets/ctz_struct_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mount_image"
path = "fuzz_targets/mount_image.rs"
test = false
doc = false
bench = false

# Workspace exclusion: the parent workspace ignores this nested
# crate so `cargo build` at the repo root does not pick it up
# automatically. The exclusion lives in the parent Cargo.toml.

[profile.release]
debug = 1
