name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  doc:
    name: cargo doc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps

  msrv:
    # Lock the library MSRV declared in Cargo.toml (rust-version = "1.84").
    # This gates the published surface: a downstream consumer pinned at
    # 1.84 must be able to depend on the crate. Dev-dependencies
    # (proptest et al.) can require a newer toolchain; that's why this
    # job builds the library only, not --all-targets.
    name: MSRV (1.84) lib build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.84
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo build --no-default-features

  no_default_features:
    name: cargo build + test --no-default-features (no_std no_alloc floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features
      # Building the floor is not the same as exercising it: the
      # kernel's own unit tests must pass with alloc and std off, or a
      # no_alloc regression ships green. The integration tests under
      # tests/ link std unconditionally, so scope this to --lib; the
      # full suite is the `test` job's responsibility.
      - run: cargo test --no-default-features --lib

  cross_compile:
    name: cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv6m-none-eabi        # Cortex-M0+
          - thumbv8m.main-none-eabi   # Cortex-M33 no-FPU
          - thumbv8m.main-none-eabihf # Cortex-M33 with FPU (SMIL's target)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target ${{ matrix.target }} --no-default-features

  conformance:
    name: C-reference conformance (consume committed vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test conformance

  roundtrip:
    name: round-trip conformance (Rust writes, C reads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build C verifier
        run: make -C tools/verify_image
      - run: cargo test --test roundtrip

  fuzz_smoke:
    # Build and briefly run every cargo-fuzz target on a bounded
    # budget. This catches a target that no longer compiles against
    # the library API or panics on its seed; it is a tripwire, not a
    # campaign (the exhaustive runs stay manual, see fuzz/README.md).
    #
    # Advisory, exactly like the kani job: it is deliberately kept out
    # of the required-checks list, because a nightly libFuzzer or
    # sanitizer toolchain regression should surface here rather than
    # block changes unrelated to the fuzz surface. A genuine panic
    # still fails this job (no continue-on-error), it just does not
    # gate the merge.
    name: fuzz smoke (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: smoke every target
        working-directory: fuzz
        run: |
          set -euo pipefail
          for t in $(cargo +nightly fuzz list); do
            echo "::group::fuzz $t"
            cargo +nightly fuzz run "$t" -- -runs=20000 -max_total_time=30
            echo "::endgroup::"
          done

  kani:
    # Discharge every #[kani::proof] under src/verify/ via the
    # model-checking action. The two commit_proofs harnesses
    # symbolically explore MetadataReader::new on adversarial bytes
    # (with crc::update stubbed for tractability; CRC correctness
    # is proved separately in crc_proofs). The FCRC validation added
    # to MetadataReader::new in v1.1.0 grew the panic-freedom harness's
    # CBMC solving time past the original 180s timeout, so the
    # per-harness budget is 360s. This restores headroom and keeps the
    # full proof rather than weakening it with tighter unwinds or stubs.
    #
    # We do not gate the rest of CI on this job: Kani's toolchain
    # pinning can lag stable Rust, and we would rather flag a
    # regression here than block unrelated PRs. This is a deliberate,
    # accepted tradeoff (a proof regression lands non-blocking); the
    # README hedges accordingly.
    #
    # The action and the Kani version are pinned tightly rather than
    # tracked by floating `@v1` / `kani-version: latest`. A floating
    # Kani is what silently changed proof-compilation behaviour
    # before; pinning makes a Kani bump an explicit, reviewed change.
    # Bump both deliberately when adopting a newer Kani.
    name: cargo kani (formal verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: 0.67.0
          args: >-
            --features kani
            -Z unstable-options
            -Z stubbing
            --harness-timeout 360s
            -j
            --output-format terse
